name: 掲載申請の取り込み

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: custom.json へ追記
        run: node scripts/ingest-issue.mjs

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/custom.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "feat: 掲載申請 #${{ github.event.issue.number }} を追加"
          git push

      - name: お知らせコメント
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✅ 掲載キューに追加しました。次回の自動巡回（4時間ごと）でサイトに反映されます。" || true
