const daysAgoStr = d => new Date(Date.now() - d*864e5).toISOString().slice(0,10);
const CATEGORIES = [

const CAT_LABELS = {new:{ja:"🆕 新着リリース",en:"🆕 New"},trending:{ja:"🔥 トレンド",en:"🔥 Trending"},selfhosted:{ja:"🏠 セルフホスト",en:"🏠 Self-hosted"},ai:{ja:"🤖 AI・LLM",en:"🤖 AI & LLM"},devtools:{ja:"🛠️ 開発ツール",en:"🛠️ Dev Tools"}};

const DESC_NOISE = /\b(awesome list|curated list|a list of|collection of (links|resources)|interview questions|study (plan|guide))\b/i;
const ADULT = /\bnsfw\b|porn|hentai|xxx|18\+|not-for-all-audiences|erotic|onlyfans/i;

}

async function boot(){

    try{
      const r = await fetch("data/data.json",{cache:"no-store"});
      if(r.ok){ const d=await r.json();
        if(d.items&&d.items.length&&!d.meta.seed){ state.items=d.items; state.generatedAt=d.meta.generatedAt; state.mode="auto"; ok=true; } }
    }catch(e){}
    try{ const ar=await fetch("data/articles.json",{cache:"no-store"}); if(ar.ok) state.articles=(await ar.json()).articles||[]; }catch(e){}
  }
  if(!ok){
    try{ await liveFetch(); state.mode="live"; ok=true; }catch(e){ showError(e); return; }
    try{ const cr=await fetch("data/custom.json",{cache:"no-store"}); if(cr.ok){ const cl=(await cr.json()).items||[];
      for(const c of cl){ state.items.push({src:c.src||"own",f:c.f||c.n,n:c.n,o:c.o||"",a:c.a||"",u:c.u||c.h||"#",h:c.h||null,d:c.d||"",dj:c.dj||(/[぀-ヿ一-鿿]/.test(c.d||"")?c.d:null),e:c.e||null,s:c.s||0,fk:0,l:c.l||null,t:c.t||[],lic:c.lic||null,c:c.c||new Date().toISOString(),p:c.p||new Date().toISOString(),cats:c.cats||[],uc:c.uc}); } } }catch(e){}
  }
  buildAll();
}

  CATEGORIES.forEach(c=>c.queries.forEach(([q])=>jobs.push(
    fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=30`,{headers:{Accept:"application/vnd.github+json"}})
    .then(r=>r.ok?r.json():Promise.reject(new Error("gh "+r.status)))
    .then(j=>({kind:"gh",cat:c.id,items:j.items||[]}))
  )));
  jobs.push(fetch("https://huggingface.co/api/spaces?sort=likes&direction=-1&limit=100&full=true").then(r=>r.json()).then(j=>({kind:"hf",items:j})));
  jobs.push(fetch("https://gitlab.com/api/v4/projects?order_by=star_count&sort=desc&per_page=60&visibility=public").then(r=>r.json()).then(j=>({kind:"gl",items:j})));
  jobs.push(fetch("https://codeberg.org/api/v1/repos/search?sort=stars&order=desc&limit=50").then(r=>r.json()).then(j=>({kind:"cb",items:j.data||[]})));
  jobs.push(fetch(`https://hn.algolia.com/api/v1/search?tags=show_hn&numericFilters=points%3E%3D40,created_at_i%3E%3D${Math.floor(Date.now()/1e3)-30*86400}&hitsPerPage=60`).then(r=>r.json()).then(j=>({kind:"sns",items:(j.hits||[]).filter(h=>h.url&&(h.points||0)>=40&&!/github\.com/.test(h.url)).map(h=>{
    const t=(h.title||"").replace(/^show hn:?\s*/i,"");const created=new Date((h.created_at_i||0)*1e3).toISOString();
    let host="web";try{host=new URL(h.url).hostname.replace(/^www\./,"");}catch(e){}
    return {src:"hn",f:"hn:"+h.objectID,n:t.slice(0,80),o:host,a:"",u:"https://news.ycombinator.com/item?id="+h.objectID,h:h.url,d:t,dj:null,e:null,s:h.points||0,fk:0,l:null,t:[],lic:null,c:created,p:created,cats:["new"]};
  })})));
  jobs.push(fetch("https://dev.to/api/articles?tag=showdev&top=7&per_page=40").then(r=>r.json()).then(arts=>({kind:"sns",items:(arts||[]).filter(a=>(a.positive_reactions_count||0)>=20).map(a=>(
    {src:"dv",f:"dv:"+a.id,n:(a.title||"").slice(0,80),o:a.user?.username||"dev.to",a:a.user?.profile_image_90||"",u:a.url,h:a.url,d:a.description||a.title||"",dj:null,e:null,s:a.positive_reactions_count||0,fk:0,l:null,t:(a.tag_list||[]).slice(0,6),lic:null,c:a.published_at,p:a.published_at,cats:daysSince(a.published_at)<=30?["new"]:[]}
  ))})));
  jobs.push(fetch("https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=%23buildinpublic&sort=top&limit=100").then(r=>r.json()).then(j=>({kind:"sns",items:(j.posts||[]).filter(p=>p.embed?.external?.uri&&(p.likeCount||0)>=15&&!/github\.com/.test(p.embed.external.uri)).map(p=>{
    const rkey=String(p.uri||"").split("/").pop();const created=p.record?.createdAt||p.indexedAt;const ext=p.embed.external;
    return {src:"bs",f:"bs:"+rkey,n:(ext.title||p.record?.text||"").slice(0,80),o:p.author?.handle||"bsky",a:p.author?.avatar||"",u:`https://bsky.app/profile/${p.author?.handle}/post/${rkey}`,h:ext.uri,d:(ext.description||p.record?.text||"").slice(0,240),dj:null,e:null,s:p.likeCount||0,fk:0,l:null,t:[],lic:null,c:created,p:created,cats:daysSince(created)<=30?["new"]:[]};
  })})));
  const settled = await Promise.allSettled(jobs);
  const map=new Map(); const seen=new Map(); let okCount=0;
  const normUrl=u=>{try{const x=new URL(u);return (x.hostname.replace(/^www\./,"")+x.pathname).replace(/\/+$/,"").toLowerCase();}catch(e){return String(u);}};
  const deriveCats=(topics,created)=>{
    const s=new Set(topics||[]); const cats=[]; const age=daysSince(created);
    if(age<=30)cats.push("new"); else if(age<=90)cats.push("trending");
    if(s.has("self-hosted")||s.has("selfhosted"))cats.push("selfhosted");
    if(["llm","ai","ai-agents","machine-learning","deep-learning","rag","chatbot","gpt"].some(t=>s.has(t)))cats.push("ai");
    if(["developer-tools","devops","kubernetes","cli","ci","cicd","monitoring"].some(t=>s.has(t)))cats.push("devtools");
    return cats;
  };
  for(const res of settled){
    if(res.status!=="fulfilled")continue; okCount++;
    const v=res.value;
    if(v.kind==="gh"){
      for(const r of v.items){
        if(r.archived||r.fork||isNoise(r.name,r.topics,r.description))continue;
        const key="gh/"+r.full_name;
        const cur=map.get(key)||{src:"gh",f:r.full_name,n:r.name,o:r.owner?.login||"",a:r.owner?.avatar_url||"",u:r.html_url,
          h:(r.homepage||"").trim()||null,d:r.description||"",dj:null,e:null,s:r.stargazers_count||0,fk:r.forks_count||0,
          l:r.language||null,t:(r.topics||[]).slice(0,6),lic:r.license&&r.license.spdx_id!=="NOASSERTION"?r.license.spdx_id:null,
          c:r.created_at,p:r.pushed_at,cats:[]};
        if(!cur.cats.includes(v.cat))cur.cats.push(v.cat);
        map.set(key,cur);
      }
    }else if(v.kind==="hf"){
      for(const sp of v.items){
        if((sp.likes||0)<100)continue;
        const tags=(sp.tags||[]).filter(t=>!t.includes(":"));
        const title=sp.cardData?.title||String(sp.id||"").split("/")[1]||"";
        const desc=sp.cardData?.short_description||title;
        if(isNoise(title,tags,desc))continue;
        const url="https://huggingface.co/spaces/"+sp.id;
        const created=sp.createdAt||sp.lastModified||new Date().toISOString();
        map.set("hf/"+sp.id,{src:"hf",f:sp.id,n:title||sp.id.split("/")[1],o:sp.id.split("/")[0],a:"",u:url,h:url,d:desc,dj:null,
          e:sp.cardData?.emoji||null,s:sp.likes||0,fk:0,l:sp.sdk||null,t:tags.slice(0,6),lic:null,c:created,p:sp.lastModified||created,
          cats:["ai",...deriveCats(tags,created).filter(c=>c!=="ai")]});
      }
    }else if(v.kind==="gl"){
      for(const p of v.items){
        if((p.star_count||0)<300||isNoise(p.name,p.topics,p.description))continue;
        map.set("gl/"+p.path_with_namespace,{src:"gl",f:p.path_with_namespace,n:p.name,o:(p.path_with_namespace||"").split("/")[0],
          a:p.avatar_url||"",u:p.web_url,h:null,d:p.description||"",dj:null,e:null,s:p.star_count||0,fk:p.forks_count||0,l:null,
          t:(p.topics||[]).slice(0,6),lic:null,c:p.created_at,p:p.last_activity_at,cats:deriveCats(p.topics,p.created_at)});
      }
    }else if(v.kind==="cb"){
      for(const r of v.items){
        if((r.stars_count||0)<50||r.archived||r.fork||isNoise(r.name,r.topics,r.description))continue;
        map.set("cb/"+r.full_name,{src:"cb",f:r.full_name,n:r.name,o:r.owner?.login||"",a:r.owner?.avatar_url||"",u:r.html_url,
          h:(r.website||"").trim()||null,d:r.description||"",dj:null,e:null,s:r.stars_count||0,fk:r.forks_count||0,l:r.language||null,
          t:(r.topics||[]).slice(0,6),lic:null,c:r.created_at,p:r.updated_at,cats:deriveCats(r.topics,r.created_at)});
      }
    }else if(v.kind==="sns"){
      for(const it of v.items){
        if(isNoise(it.n,it.t,it.d))continue;
        const nu=it.h?normUrl(it.h):it.f;
        const prevKey=seen.get(nu);
        if(prevKey){ const prev=map.get(prevKey); if(prev&&prev.s>=it.s)continue; map.delete(prevKey); }
        seen.set(nu,"sns/"+it.f);
        map.set("sns/"+it.f,it);
      }
    }
  }
  if(!okCount) throw new Error(L==="ja"?"各APIに接続できません（レート制限の可能性）。1分ほど待って再試行してください。":"Could not reach the APIs (possibly rate-limited). Wait a minute and retry.");
  state.items=[...map.values()];
  for(const it of state.items){ if(!it.co && /[぀-ヿ一-鿿]/.test((it.n||"")+(it.d||""))) it.co="JP"; if(!it.co&&it.h){ const cc=tldCountry(it.h); if(cc) it.co=cc; } }
  state.generatedAt=new Date().toISOString();
}

/* ===== 集計 ===== */
function countBy(get){
  const m=new Map();
  for(const it of state.items) for(const v of get(it)) if(v) m.set(v,(m.get(v)||0)+1);
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
let MIXED=[];
function computeMixed(){
  const m=new Map();
  for(const it of state.items){
    const g=genreOf(it); if(!g||g==="その他")continue;
    const push=(k,g2,v2)=>{ const cur=m.get(k)||{v:g,g2,v2,c:0}; cur.c++; m.set(k,cur); };
    if(it.l) push(g+"×l:"+it.l,"lang",it.l);
    push(g+"×s:"+it.src,"src",SRC[it.src]?.name||it.src);
    const u=ucGet(it)[0]; if(u) push(g+"×u:"+u,"uc",u);
    if(it.co) push(g+"×c:"+it.co,"co",it.co);
  }
  MIXED=[...m.entries()].filter(([,v])=>v.c>=3).sort((a,b)=>b[1].c-a[1].c).slice(0,110).map(([,v])=>v);
}

  const defs=[...CATEGORIES.map(c=>({id:c.id,label:CAT_LABELS[c.id][L]})),{id:"all",label:T("tabAll")},{id:"favs",label:T("tabFavs")},{id:"posts",label:T("tabPosts")},{id:"dir",label:T("tabDir")}];
  $("#tabs").innerHTML = defs.map(d=>`<button class="tab${d.id===state.tab?" on":""}" data-tab="${d.id}">${d.label}${d.id!=="dir"&&d.id!=="posts"?`<span class="cnt">${cnt(d.id)}</span>`:d.id==="posts"?`<span class="cnt">${state.articles.length}</span>`:""}</button>`).join("");

function renderSidebar(){
  $("#sidebar").innerHTML = FACETS.map(fc=>{
    const rows=countBy(fc.get).slice(0,fc.top);
    if(!rows.length)return"";
    return `<div class="fgroup"><div class="fhead">${FACET_HEADS[fc.id][L]}</div>`+
      rows.map(([v,c])=>`<button class="fitem${state.facets[fc.id]===v?" on":""}" data-g="${fc.id}" data-v="${esc(v)}">${esc(dispFacet(fc.id,v))}<span class="c">${c}</span></button>`).join("")+
      `</div>`;
  }).join("")+`<div class="fgroup"><button class="fmore" data-alldir="1">${T("allCats")}</button></div>`;
}

function renderStatus(){
  const bySrc={}; state.items.forEach(i=>bySrc[i.src]=(bySrc[i.src]||0)+1);
  const srcTxt=Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${SRC[k]?.name||k} ${v}`).join(" ・ ");
  const dt=state.generatedAt?new Date(state.generatedAt).toLocaleString(L==="ja"?"ja-JP":"en-US",{timeZone:L==="ja"?"Asia/Tokyo":undefined,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
  $("#statusbar").innerHTML=`<span class="dot"></span>${T("statItems")} <b>${state.items.length}</b>（${srcTxt}）・ ${T("statCrawl")} ${dt}${L==="ja"?" (JST)":""} ・ `+(state.mode==="auto"?T("statAuto"):T("statLive"));
}

function renderActive(){
  const chips=[];
  if(state.ai) chips.push(`<span class="chip ai" data-clear="ai">🤖 ${esc(state.ai.q.slice(0,30))}${state.ai.q.length>30?"…":""} ✕</span>`);
  for(const [g,v] of Object.entries(state.facets)) if(v) chips.push(`<span class="chip" data-clear="${g}">${esc(dispFacet(g,v))} ✕</span>`);
  if(state.q) chips.push(`<span class="chip" data-clear="q">🔍 ${esc(state.q)} ✕</span>`);
  $("#activebar").innerHTML=chips.length?chips.join("")+`<span class="chip" data-clear="all">${T("clearAll")}</span>`:"";
}

function matches(it){
  for(const fc of FACETS){ const v=state.facets[fc.id]; if(v && !fc.get(it).includes(v)) return false; }
  if(state.tab==="favs"){ if(!state.favs.has(it.src+"/"+it.f)) return false; }
  else if(state.tab!=="all"&&state.tab!=="dir"&&state.tab!=="posts" && !(it.cats||[]).includes(state.tab)) return false;
  const q=state.q.toLowerCase();
  if(q && !((it.f+" "+it.n+" "+(it.o||"")+" "+it.d+" "+(it.dj||"")+" "+(it.t||[]).join(" ")).toLowerCase().includes(q))) return false;
  return true;
}

function render(){
  renderActive();
  const el=$("#content");
  if(state.tab==="dir"){ el.innerHTML=renderDirectory(); $("#rescount").textContent=""; return; }
  if(state.tab==="posts"){ el.innerHTML=renderPosts(); $("#rescount").textContent=""; return; }
  let list;
  if(state.ai){ list=state.ai.list.filter(x=>matches(x.it)); }
  else{
    list=state.items.filter(matches).map(it=>({it}));
    const sorters={velocity:(a,b)=>velocity(b.it)-velocity(a.it),stars:(a,b)=>b.it.s-a.it.s,created:(a,b)=>new Date(b.it.c)-new Date(a.it.c),pushed:(a,b)=>new Date(b.it.p)-new Date(a.it.p)};
    list.sort(sorters[state.sort]);
    if(state.jpFirst){ const jp=list.filter(x=>x.it.co==="JP"), rest=list.filter(x=>x.it.co!=="JP"); list=[...jp,...rest]; }
  }
  $("#rescount").textContent=list.length+T("results");
  const slice=list.slice(0,state.shown);
  const moreN=list.length-slice.length;
  el.innerHTML=list.length
    ? `<div class="grid">${slice.map(x=>card(x.it,x.reason)).join("")}</div>`+(moreN>0?`<div class="state" style="padding:24px"><button class="retry" id="morebtn">${T("more")(moreN)}</button></div>`:"")
    : `<div class="state">${T("noResults")}</div>`;
}

function thumbInner(it){
  const isNew=daysSince(it.c)<31;
  const genre=genreOf(it);
  const src=SRC[it.src]||{name:it.src,color:"#888"};
  const og=it.src==="gh"?`<img loading="lazy" src="https://opengraph.githubassets.com/1/${esc(it.f)}" alt="" onerror="this.remove()">`:"";
  const phTxt=it.e?esc(it.e):esc((it.n||"?")[0].toUpperCase());
  return `<div class="ph">${phTxt}</div>${og}
    ${isNew?`<span class="badge-new">${esc(STR.day[L](Math.max(1,Math.floor(daysSince(it.c)))))}</span>`:""}
    ${genre&&genre!=="その他"?`<span class="badge-genre">${esc(disp("genre",genre))}</span>`:""}
    <span class="badge-src" style="color:${src.color}">${esc(src.name)}</span>`;
}

function card(it,reason){
  const key=it.src+"/"+it.f;
  const fav=state.favs.has(key);
  const vel=velocity(it);
  const lc=LANG_COLORS[it.l]||"#8b949e";
  const translated=it.dj&&it.d&&it.dj!==it.d;
  const descText=L==="ja"?(it.dj||it.d||""):(it.d||it.dj||"");
  const showTr=L==="ja"&&translated;
  return `<article class="card">
  <a class="thumb" href="${esc(it.u)}" target="_blank" rel="noopener">${thumbInner(it)}</a>
  <div class="body">
    <div class="titlerow">
      ${it.a?`<img loading="lazy" src="${esc(it.a)}" alt="" onerror="this.remove()">`:""}
      <a class="name" href="${esc(it.u)}" target="_blank" rel="noopener">${it.o&&it.o!==it.n?`<span class="owner">${esc(it.o)}/</span>`:""}${esc(it.n)}</a>
      <span class="stars">★ ${fmtStars(it.s)}</span>
    </div>
    ${reason?`<div class="aireason">🤖 ${esc(reason)}</div>`:""}
    <p class="desc" ${showTr?`title="${esc(T("orig")+it.d)}"`:""}>${showTr?'<span class="trbadge">訳</span>':""}${esc(descText)||T("noDesc")}</p>
    <div class="topics">${(it.t||[]).slice(0,5).map(t=>`<span class="tp">${esc(t)}</span>`).join("")}</div>
    <div class="meta">
      ${it.l?`<span class="lang" style="--lc:${lc}">${esc(it.l)}</span>`:""}
      ${it.lic?`<span>${esc(it.lic)}</span>`:""}
      ${it.co?`<span>${flagOf(it.co)} ${esc(countryName(it.co))}</span>`:""}
      <span>${T("updated")}${rel(it.p)}</span>
      ${vel>=1?`<span class="vel">+${vel>=10?Math.round(vel):vel.toFixed(1)}★/${L==="ja"?"日":"day"}</span>`:""}
    </div>
  </div>
  <div class="actions">
    ${it.h?`<a class="btn site" href="${esc(it.h)}" target="_blank" rel="noopener">${T("visit")}</a>`:""}
    <a class="btn" href="${esc(it.u)}" target="_blank" rel="noopener">${esc(SRC[it.src]?.name||"Link")}</a>
    <button class="btn favbtn${fav?" on":""}" data-fav="${esc(key)}" title="favorite">${fav?"♥":"♡"}</button>
  </div>
</article>`;
}

function renderPosts(){
  if(!state.articles.length) return `<div class="state">${T("postsEmpty")}</div>`;
  const byKey=new Map(state.items.map(i=>[i.src+"/"+i.f,i]));
  const note=T("postsNote");
  return (note?`<p style="color:var(--muted);font-size:.76rem;margin-bottom:12px">${note}</p>`:"")+
    '<div class="posts">'+state.articles.map(a=>{
    const it=byKey.get(a.key);
    const d=new Date(a.date).toLocaleDateString(L==="ja"?"ja-JP":"en-US",{month:"numeric",day:"numeric"});
    return `<article class="post"><div class="pdate">${esc(d)} ・ ${esc(SRC[a.src]?.name||a.src)}${a.llm?" ・ "+T("aiWritten"):""}</div><h2>${esc(a.title)}</h2>${(a.body||[]).map(p=>`<p>${esc(p)}</p>`).join("")}<div class="plinks">${it&&it.h?`<a class="btn site" href="${esc(it.h)}" target="_blank" rel="noopener">${T("visit")}</a>`:""}${it?`<a class="btn" href="${esc(it.u)}" target="_blank" rel="noopener">${esc(SRC[it.src]?.name||"Link")}</a>`:""}</div></article>`;
  }).join("")+"</div>";
}

function renderDirectory(){
  const bySrc={}; state.items.forEach(i=>bySrc[i.src]=(bySrc[i.src]||0)+1);
  let html=`<div class="dirstats">
    <div><b>${state.items.length}</b><span>${T("dirServices")}</span></div>
    ${Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><b>${v}</b><span>${esc(SRC[k]?.name||k)}</span></div>`).join("")}
    <div><b>${MIXED.length}</b><span>${T("dirMixed")}</span></div>
  </div>`;
  for(const fc of FACETS){
    const rows=countBy(fc.get);
    if(!rows.length)continue;
    html+=`<div class="dsec"><div class="dcol"><div class="dhead">${FACET_HEADS[fc.id][L]}</div></div><div class="dcols">`+
      rows.map(([v,c])=>`<button class="fbtn" data-g="${fc.id}" data-v="${esc(v)}">${esc(dispFacet(fc.id,v))}<span class="c">${c}</span></button>`).join("")+
      `</div></div>`;
  }
  if(MIXED.length){
    html+=`<div class="dsec"><div class="dcol"><div class="dhead">${T("mixedHead")}</div></div><div class="dcols">`+
      MIXED.map(v=>`<button class="fbtn" data-g="genre" data-v="${esc(v.v)}" data-g2="${v.g2}" data-v2="${esc(v.v2)}">${esc(disp("genre",v.v))} × ${esc(dispFacet(v.g2,v.v2))}<span class="c">${v.c}</span></button>`).join("")+
      `</div></div>`;
  }
  const devs=new Map();
  for(const it of state.items){
    if(!it.o)continue;
    const k=it.src+":"+it.o;
    const d=devs.get(k)||{o:it.o,src:it.src,a:it.a,total:0,month:0,stars:0};
    d.total++; d.stars+=it.s; if(daysSince(it.c)<=31)d.month++; if(!d.a&&it.a)d.a=it.a;
    devs.set(k,d);
  }
  const monthTop=[...devs.values()].filter(d=>d.month>=1).sort((a,b)=>b.month-a.month||b.stars-a.stars).slice(0,10);
  const totalTop=[...devs.values()].filter(d=>d.total>=2).sort((a,b)=>b.total-a.total||b.stars-a.stars).slice(0,10);
  const devRow=(d,n,unit)=>`<button class="fbtn devbtn" data-dev="${esc(d.o)}">${flagOf(null)===""?"":""}${esc(d.o)} <span style="color:var(--muted);font-size:.7rem">(${esc(SRC[d.src]?.name||d.src)})</span><span class="c">${n}${unit}</span></button>`;
  if(monthTop.length||totalTop.length){
    html+=`<div class="dsec"><div class="dcol"><div class="dhead">${T("devHead")}</div></div><div class="dcols">`+
      `<div class="dcol"><div class="dhead">${T("devMonth")}</div>${monthTop.map(d=>devRow(d,d.month,L==="ja"?"件":"")).join("")}</div>`+
      `<div class="dcol"><div class="dhead">${T("devTotal")}</div>${totalTop.map(d=>devRow(d,d.total,L==="ja"?"件":"")).join("")}</div>`+
      `</div></div>`;
  }
  return html;
}

/* ===== AI検索 ===== */
function aiMatch(query){
  const tokens=(query.match(/[A-Za-z0-9.+#-]{2,}|[ぁ-ヶー一-龯]{2,}/g)||[]);
  const en=new Set();
  for(const t of tokens){
    if(/^[A-Za-z0-9.+#-]+$/.test(t)) en.add(t.toLowerCase());
    for(const [jp,words] of Object.entries(DICT)) if(t.includes(jp)||jp.includes(t)) words.split(" ").forEach(w=>en.add(w));
  }
  const scored=[];
  for(const it of state.items){
    let sc=0;
    const name=(it.f+" "+it.n).toLowerCase(), topics=(it.t||[]).join(" ").toLowerCase(), d=(it.d||"").toLowerCase(), dj=it.dj||"";
    for(const t of tokens) if(/[ぁ-龯]/.test(t) && dj.includes(t)) sc+=3;
    for(const w of en){
      if(name.includes(w))sc+=3;
      if(topics.includes(w))sc+=2.5;
      if(d.includes(w))sc+=1.5;
    }
    if(sc>0) scored.push({it,sc});
  }
  scored.sort((a,b)=>b.sc-a.sc||b.it.s-a.it.s);
  return scored.slice(0,40);
}

async function aiLLM(query,candidates,key){
  const lines=candidates.slice(0,60).map(({it})=>`${it.f} :: ${genreOf(it)} :: ${(it.dj||it.d||"").slice(0,110)}`).join("\n");
  const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",temperature:0.2,max_tokens:900,response_format:{type:"json_object"},
      messages:[
        {role:"system",content:'あなたはOSS/無料Webサービスの案内人。ユーザーの要望に本当に合うサービスだけを候補一覧から最大10件選び、JSONのみ返す: {"results":[{"f":"<候補のID>","reason":"<なぜ合うか40字以内。要望と同じ言語で>"}]} 合うものが無ければ空配列。'},
        {role:"user",content:`要望: ${query}\n\n候補一覧:\n${lines}`}
      ]})});
  if(!res.ok) throw new Error("Groq API "+res.status);
  const j=await res.json();
  const parsed=JSON.parse(j.choices[0].message.content);
  const byF=new Map(state.items.map(i=>[i.f,i]));
  return (parsed.results||[]).map(r=>({it:byF.get(r.f),reason:r.reason})).filter(x=>x.it);
}

async function runAI(){
  const q=$("#aiq").value.trim();
  if(!q)return;
  $("#aimodal").classList.add("hidden");
  $("#content").innerHTML=`<div class="state"><div class="spinner"></div>${T("aiSearching")}</div>`;
  const cands=aiMatch(q);
  let list=cands.map(({it})=>({it})), used="match";
  const key=store&&store.getItem("groqKey");
  if(key&&cands.length){
    try{ const llm=await aiLLM(q,cands,key); if(llm.length){list=llm;used="llm";} }
    catch(e){ console.warn("LLM fallback:",e); }
  }
  state.ai={q,list,used};
  state.tab="all"; state.shown=CHUNK; renderTabs(); render();
}

function showError(e){
  $("#content").innerHTML=`<div class="state">⚠️ ${esc(e.message||"error")}<br><button class="retry" onclick="location.reload()">${T("retry")}</button></div>`;
  $("#statusbar").innerHTML=`<span class="dot" style="background:#f85149"></span>${T("connErr")}`;
}

/* ===== イベント ===== */
function applyFacetClick(btn){
  state.shown=CHUNK;
  const g=btn.dataset.g,v=btn.dataset.v;
  state.facets[g]=state.facets[g]===v?null:v;
  if(btn.dataset.g2) state.facets[btn.dataset.g2]=btn.dataset.v2;
  if(state.tab==="dir"||state.tab==="posts"){state.tab="all";}
  renderTabs(); renderSidebar(); render();
}
$("#sidebar").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.alldir){state.tab="dir";renderTabs();render();$("#sidebar").classList.remove("open");return;}
  applyFacetClick(b); $("#sidebar").classList.remove("open");
});
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  state.tab=b.dataset.tab; state.shown=CHUNK; renderTabs(); render();
});
$("#content").addEventListener("click",e=>{
  if(e.target.id==="morebtn"){ state.shown+=CHUNK; render(); return; }
  const fb=e.target.closest(".favbtn");
  if(fb){ const k=fb.dataset.fav; state.favs.has(k)?state.favs.delete(k):state.favs.add(k); saveFavs(); renderTabs(); render(); return; }
  const db=e.target.closest(".devbtn");
  if(db){ state.q=db.dataset.dev; $("#q").value=state.q; state.tab="all"; state.shown=CHUNK; renderTabs(); render(); return; }
  const b=e.target.closest(".fbtn"); if(!b)return;
  applyFacetClick(b);
});
$("#activebar").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c)return;
  const k=c.dataset.clear;
  if(k==="all"){ state.ai=null; state.q=""; $("#q").value=""; for(const g in state.facets)state.facets[g]=null; }
  else if(k==="ai") state.ai=null;
  else if(k==="q"){ state.q=""; $("#q").value=""; }
  else state.facets[k]=null;
  state.shown=CHUNK; renderSidebar(); render();
});
$("#q").addEventListener("input",e=>{state.q=e.target.value;state.shown=CHUNK;render();});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;state.shown=CHUNK;render();});
$("#jpfirst").addEventListener("change",e=>{state.jpFirst=e.target.checked;state.shown=CHUNK;render();});
$("#langbtn").addEventListener("click",()=>{ L=L==="ja"?"en":"ja"; if(store)store.setItem("lang",L); buildAll(); });
$("#aibtn").addEventListener("click",()=>{ $("#aimodal").classList.remove("hidden"); if(store&&store.getItem("groqKey"))$("#groqkey").value=store.getItem("groqKey"); });
$("#aiclose").addEventListener("click",()=>$("#aimodal").classList.add("hidden"));
$("#aimodal").addEventListener("click",e=>{if(e.target.id==="aimodal")$("#aimodal").classList.add("hidden");});
$("#airun").addEventListener("click",runAI);
$("#aiq").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))runAI();});
$("#savekey").addEventListener("click",()=>{ if(store){store.setItem("groqKey",$("#groqkey").value.trim());} $("#savekey").textContent=T("saved"); setTimeout(()=>$("#savekey").textContent=T("save"),1500); });
$("#fltbtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));

updateTexts();
boot();
</script>
